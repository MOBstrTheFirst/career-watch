# ---------------------------------------------------------------------------
# Career watcher - site list (generated 2026-10-14 from company_job_pages_monitor.txt)
#
# js: was set per page after opening every URL in a real browser and comparing
#     the rendered page with the plain HTML:
#       true = job list is built by JavaScript (or in an iframe), or the site could
#              not be tested -> always use the headless browser (safer: no misses)
#       auto = job links are already in the plain HTML -> fast download; the script
#              still switches to the browser by itself if it ever finds no job links
# fit: your fit score from the list (10 = best). Sites are sorted by fit.
# Lines starting with "# CHECK:" need a look from you (bad URL, homepage, blocked).
# Disabled pages (dead, parked, HIJACKED) are at the end, commented out.
# ---------------------------------------------------------------------------

concurrency: 6          # pages checked in parallel per part (4 parts run at the same time)

daily_summary_time: "23:55"
