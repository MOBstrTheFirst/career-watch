name: career-watch

on:
  schedule:
    # 4 times per hour (UTC). Odd minutes avoid GitHub's busy :00 slot.
    - cron: "7,22,37,52 * * * *"
    # Extra run for the 23:55 Berlin daily summary (GitHub uses UTC:
    # 21:55 UTC = 23:55 summer time, 22:55 UTC = 23:55 winter time).
    - cron: "55 21,22 * * *"
  workflow_dispatch:        # "Run workflow" button for manual runs

permissions:
  contents: write           # needed to save state.json back to the repo

concurrency:
  group: career-watch       # never run two checks at the same time
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check careers pages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watcher.py

      - name: Save state
        if: always()
        run: |
          git config user.name  "career-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f state.json ] || exit 0
          git add state.json
          if git diff --cached --quiet; then echo "no state change"; exit 0; fi
          git commit -m "update state [bot]"
          git pull --rebase
          git push

  # Sends a Telegram message if the job above crashed or timed out.
  # Runs on its own machine, so it works even when the main job died.
  alert-on-failure:
    needs: watch
    if: ${{ always() && needs.watch.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send Telegram alert
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=CRASH: career watcher run failed or timed out. Jobs were NOT checked this time. Log: ${RUN_URL}" \
            --data-urlencode "disable_web_page_preview=true"
